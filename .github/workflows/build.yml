name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on master queue instead, so
# a newer push can never cancel a release that is being published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Extensions are discovered the same way as extensions/registry.ts does it:
  # every folder under extensions/ with a manifest.config.ts.
  list:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          extensions=$(ls extensions/*/manifest.config.ts | cut -d/ -f2 | jq -Rcn '[inputs]')
          echo "extensions=$extensions" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.extension }}
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(needs.list.outputs.extensions) }}
    env:
      EXT: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Build for Chrome
        run: npx wxt zip -b chrome

      - name: Build for Firefox
        run: npx wxt zip -b firefox

      # <ext>-<version>-chrome.zip, <ext>-<version>-firefox.zip and
      # <ext>-<version>-sources.zip (the source archive AMO asks for).
      # .output is a dot folder, which upload-artifact treats as hidden and
      # skips unless include-hidden-files is set. Only the zips match the path.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.extension }}
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error

  # Publishes release v<version> (version from package.json) with the Chrome
  # and Firefox zips of every extension, once all builds have passed. A version
  # is released only once: later pushes with the same version are skipped, so
  # bump the version in package.json to publish a new release.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for an existing release
        id: version
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists. Bump the version in package.json to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*-chrome.zip dist/*-firefox.zip \
            --title "$TAG" --target "$GITHUB_SHA" --generate-notes
